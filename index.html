<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 兵器谱 —— AI 工具导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9F7F3;
  --text:#1A1A1A;
  --text-secondary:#6B6B6B;
  --text-muted:#9B9B9B;
  --border:#E6E2DA;
  --border-hover:#C4BEB2;
  --card-bg:#FFFFFF;
  --card-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --card-shadow-hover:0 8px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
  --dot-color:rgba(0,0,0,.05);
  --mark-bg:rgba(255,200,0,.4);
  --input-bg:#FFFFFF;
  --nav-bg:rgba(249,247,243,.92);
  --header-bg:rgba(249,247,243,.88);
  --empty-color:#D4CEC3;
  --cat-01:#FF5E3A;
  --cat-02:#D9468F;
  --cat-03:#7C3AED;
  --cat-04:#059669;
  --cat-05:#D97706;
  --cat-06:#2563EB;
  --cat-07:#EA580C;
  --cat-08:#DB2777;
  --cat-09:#0891B2;
  --font-display:'Space Grotesk','PingFang SC','Microsoft YaHei',-apple-system,system-ui,sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',-apple-system,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0F0F0F;
  --text:#E8E6E3;
  --text-secondary:#A0A0A0;
  --text-muted:#6B6B6B;
  --border:#2A2A2A;
  --border-hover:#444;
  --card-bg:#1A1A1A;
  --card-shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --card-shadow-hover:0 8px 30px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --dot-color:rgba(255,255,255,.03);
  --mark-bg:rgba(255,200,0,.25);
  --input-bg:#1A1A1A;
  --nav-bg:rgba(15,15,15,.92);
  --header-bg:rgba(15,15,15,.88);
  --empty-color:#3A3A3A;
}
html{scroll-behavior:smooth;scroll-padding-top:140px}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  position:relative;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:radial-gradient(circle,var(--dot-color) 1px,transparent 1px);
  background-size:22px 22px;
  pointer-events:none;
  z-index:-1;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit;border:none;background:none}
ul,ol{list-style:none}

/* ===== Typography ===== */
h1,h2,h3,.logo{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}

/* ===== Header Bar ===== */
header{
  position:sticky;top:0;z-index:100;
  background:var(--header-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1400px;margin:0 auto;padding:0 24px;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
}
.logo{
  font-size:1.25rem;font-weight:700;
  white-space:nowrap;
  letter-spacing:-.03em;
}
.header-stats{
  font-size:.8rem;color:var(--text-secondary);
  white-space:nowrap;
  display:flex;gap:12px;
}
.header-stats span{display:flex;align-items:center;gap:4px}
.header-stats .stat-num{font-family:var(--font-display);font-weight:600;color:var(--text)}
.header-btn{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  border:1px solid var(--border);
  background:var(--card-bg);
  color:var(--text);
  transition:all .2s;
  flex-shrink:0;
}
.header-btn:hover{border-color:var(--border-hover)}
.refresh-icon{display:inline-block;transition:transform .4s ease}
.refresh-icon.spinning{animation:refresh-spin .6s ease}
@keyframes refresh-spin{
  to{transform:rotate(360deg)}
}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  padding:10px 24px;border-radius:10px;
  background:var(--text);color:var(--bg);
  font-size:.82rem;font-weight:500;
  pointer-events:none;
  opacity:0;transition:opacity .3s ease,transform .3s ease;
  z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ===== Hero Section ===== */
.hero{
  max-width:1400px;margin:0 auto;padding:64px 24px 40px;
}
.hero h1{
  font-size:clamp(2.8rem,7vw,5.5rem);
  line-height:1.05;
  margin-bottom:12px;
  text-align:left;
}
.hero-subtitle{
  font-size:1.1rem;color:var(--text-secondary);
  margin-bottom:32px;
  max-width:600px;
}
.search-wrapper{
  position:relative;max-width:640px;margin-bottom:40px;
}
.search-wrapper input{
  width:100%;height:52px;padding:0 48px 0 20px;
  font-size:.95rem;font-family:var(--font-body);
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text);
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-wrapper input:focus{
  border-color:var(--text);
  box-shadow:0 0 0 3px rgba(26,26,26,.06);
}
.search-wrapper input::placeholder{color:var(--text-muted)}
.search-icon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:1rem;pointer-events:none;
}
.search-hint{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:3px;
  padding:3px 8px;border-radius:6px;
  background:var(--border);
  font-size:.7rem;color:var(--text-muted);
  font-family:var(--font-display);
  pointer-events:none;
  transition:opacity .2s;
}
.search-wrapper input:focus ~ .search-hint{opacity:0}

/* ===== Marquee ===== */
.marquee-wrap{
  overflow:hidden;
  mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);
}
.marquee-track{
  display:flex;gap:32px;
  animation:marquee-scroll 28s linear infinite;
  width:max-content;
  padding:8px 0;
}
.marquee-item{
  font-family:var(--font-display);
  font-size:.85rem;font-weight:500;
  color:var(--text-muted);
  white-space:nowrap;
  transition:color .2s;
  cursor:default;
}
.marquee-item:hover{color:var(--text)}
@keyframes marquee-scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ===== Category Navigation ===== */
.category-nav{
  position:sticky;top:56px;z-index:99;
  background:var(--nav-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1400px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:16px;
  height:48px;overflow-x:auto;
  scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.cat-tabs{
  display:flex;gap:4px;flex-shrink:0;
}
.cat-tab{
  padding:6px 14px;border-radius:20px;
  font-size:.8rem;font-weight:500;
  white-space:nowrap;
  color:var(--text-secondary);
  transition:all .2s;
  border:1px solid transparent;
  position:relative;
}
.cat-tab:hover{color:var(--text)}
.cat-tab.active{
  color:#fff;font-weight:600;
}
.cat-tab .cat-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:6px;vertical-align:middle;
  position:relative;top:-1px;
}
.nav-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.price-filters{
  display:flex;gap:4px;flex-shrink:0;
}
.price-btn{
  padding:5px 12px;border-radius:20px;
  font-size:.78rem;
  color:var(--text-secondary);
  border:1px solid var(--border);
  transition:all .2s;
  white-space:nowrap;
}
.price-btn:hover{border-color:var(--border-hover)}
.price-btn.active{
  background:var(--text);color:var(--bg);
  border-color:var(--text);
}

/* ===== Tools Container ===== */
.tools-main{
  max-width:1400px;margin:0 auto;padding:32px 24px 80px;
}
.tools-empty{
  text-align:center;padding:80px 20px;
  color:var(--text-muted);
}
.tools-empty .empty-icon{font-size:3rem;margin-bottom:16px}
.tools-empty p{font-size:1rem;margin-bottom:8px}
.tools-empty .empty-hint{font-size:.85rem}

/* ===== Category Section ===== */
.cat-section{margin-bottom:56px}
.cat-section-header{
  display:flex;align-items:baseline;gap:14px;
  margin-bottom:24px;
  position:relative;
}
.cat-section-num{
  font-family:var(--font-display);
  font-size:1.6rem;font-weight:700;
  color:var(--text);
  opacity:.15;
  letter-spacing:-.02em;
}
.cat-section-title{
  font-size:1.5rem;font-weight:700;
}
.cat-section-line{
  flex:1;height:2px;
  border-radius:1px;
  align-self:center;
  opacity:.2;
}

/* ===== Tool Cards Grid ===== */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
@media(max-width:1200px){.tools-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:767px){.tools-grid{grid-template-columns:1fr}}

.tool-card{
  position:relative;
  display:flex;flex-direction:column;
  padding:18px 20px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  cursor:pointer;
  overflow:hidden;
  --card-color:var(--border);
}
.tool-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--card-shadow-hover);
  border-color:var(--card-color);
}
.tool-card:hover .card-arrow{transform:translateX(3px);opacity:1}

.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-favicon{
  width:24px;height:24px;border-radius:4px;flex-shrink:0;
  object-fit:contain;background:#f5f5f5;
}
[data-theme="dark"] .card-favicon{background:#2a2a2a}
.card-name{
  font-family:var(--font-display);
  font-size:.95rem;font-weight:600;
  line-height:1.3;
  flex:1;min-width:0;
}
.card-badges{display:flex;gap:6px;flex-shrink:0;align-items:center}
.card-hot-badge{
  padding:2px 7px;border-radius:4px;
  font-size:.65rem;font-weight:600;
  background:#FF3B30;color:#fff;
  letter-spacing:.04em;
}
.card-desc{
  font-size:.82rem;color:var(--text-secondary);
  line-height:1.55;margin-bottom:12px;
  flex:1;
}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{
  padding:3px 8px;border-radius:5px;
  font-size:.7rem;color:var(--text-muted);
  background:var(--border);
  white-space:nowrap;
}
.price-badge{
  padding:2px 8px;border-radius:5px;
  font-size:.68rem;font-weight:500;
  white-space:nowrap;
}
.price-badge.free{background:#E6F7EC;color:#059669}
.price-badge.freemium{background:#FFF3E0;color:#D97706}
.price-badge.paid{background:#FBE8E8;color:#DC2626}
[data-theme="dark"] .price-badge.free{background:rgba(5,150,105,.15);color:#34D399}
[data-theme="dark"] .price-badge.freemium{background:rgba(217,119,6,.15);color:#FBBF24}
[data-theme="dark"] .price-badge.paid{background:rgba(220,38,38,.15);color:#F87171}
.card-arrow{
  position:absolute;bottom:18px;right:20px;
  font-size:1.1rem;opacity:.3;
  transition:transform .25s ease,opacity .25s ease;
  pointer-events:none;
}

/* ===== Animations ===== */
.tool-card{
  opacity:0;transform:translateY(16px);
}
.tool-card.fade-in{
  animation:card-fade-in .4s ease forwards;
}
@keyframes card-fade-in{
  to{opacity:1;transform:translateY(0)}
}

/* ===== Back to Top ===== */
.back-to-top{
  position:fixed;bottom:28px;right:28px;
  width:44px;height:44px;border-radius:10px;
  background:var(--card-bg);
  border:1px solid var(--border);
  color:var(--text);
  font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transform:translateY(10px);
  transition:all .25s ease;
  z-index:90;
  box-shadow:var(--card-shadow);
}
.back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
.back-to-top:hover{border-color:var(--border-hover);transform:translateY(-2px)}

/* ===== Footer ===== */
footer{
  border-top:1px solid var(--border);
  padding:32px 24px;
  text-align:center;
  color:var(--text-muted);
  font-size:.82rem;
}
footer a{color:var(--text-secondary);text-decoration:underline;text-underline-offset:3px}
footer a:hover{color:var(--text)}
footer p+p{margin-top:6px}

/* ===== Search Highlight ===== */
mark{
  background:var(--mark-bg);color:inherit;
  border-radius:2px;padding:0 2px;
}

/* ===== Focus styles ===== */
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:4px}
.tool-card:focus-visible{outline-offset:0}

/* ===== Responsive ===== */
@media(max-width:767px){
  .header-inner{padding:0 14px;height:52px}
  .logo{font-size:1.1rem}
  .header-stats{font-size:.72rem;gap:8px}
  .hero{padding:36px 14px 28px}
  .hero h1{font-size:2.2rem}
  .hero-subtitle{font-size:.95rem}
  .search-wrapper input{height:46px;font-size:.9rem;padding:0 42px 0 14px}
  .search-hint{display:none}
  .search-icon{left:12px}
  .nav-inner{padding:0 14px;height:44px;gap:10px}
  .cat-tab{padding:5px 10px;font-size:.73rem}
  .price-btn{padding:4px 10px;font-size:.72rem}
  .tools-main{padding:20px 14px 60px}
  .cat-section{margin-bottom:40px}
  .cat-section-header{margin-bottom:16px}
  .cat-section-num{font-size:1.3rem}
  .cat-section-title{font-size:1.2rem}
  .tool-card{padding:14px 16px}
  .card-name{font-size:.88rem}
  .card-desc{font-size:.78rem}
  .back-to-top{bottom:18px;right:14px;width:38px;height:38px}
}

@media(min-width:768px) and (max-width:1019px){
  .tools-grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1020px) and (max-width:1439px){
  .tools-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1440px){
  .tools-grid{grid-template-columns:repeat(4,1fr)}
}

/* ===== Reduced Motion ===== */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .marquee-track{animation:none}
  .tool-card,.tool-card:hover{transition:none;transform:none;opacity:1}
  .tool-card.fade-in{animation:none;opacity:1;transform:none}
  .back-to-top{transition:none}
}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner">
    <span class="logo" role="heading" aria-level="1">⚔ AI 兵器谱</span>
    <div class="header-stats" id="headerStats"></div>
    <button class="header-btn" id="refreshBtn" aria-label="刷新工具数据" title="刷新">
      <span class="refresh-icon">↻</span>
    </button>
    <button class="header-btn" id="themeToggle" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1>AI 兵器谱</h1>
  <p class="hero-subtitle">不吹不黑，帮你找到真正顺手的 AI 工具。<br>每款都用大白话讲清楚，拒绝术语包装。</p>
  <div class="search-wrapper">
    <span class="search-icon" aria-hidden="true">🔍</span>
    <input type="search" id="searchInput" placeholder="搜工具名、标签或描述…" aria-label="搜索 AI 工具">
    <span class="search-hint" aria-hidden="true"><kbd>⌘</kbd> <kbd>K</kbd></span>
  </div>
  <div class="marquee-wrap" aria-hidden="true">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>
</section>

<nav class="category-nav" id="categoryNav" aria-label="分类导航">
  <div class="nav-inner">
    <div class="cat-tabs" id="catTabs" role="tablist" aria-label="工具分类"></div>
    <span class="nav-divider" aria-hidden="true"></span>
    <div class="price-filters" id="priceFilters" role="radiogroup" aria-label="价格筛选"></div>
  </div>
</nav>

<main class="tools-main" id="toolsContainer" role="feed" aria-label="AI 工具列表">
  <div class="tools-empty" id="toolsEmpty" style="display:none">
    <div class="empty-icon">🫗</div>
    <p>没找到匹配的工具</p>
    <p class="empty-hint">试试换个关键词，或清空筛选条件</p>
  </div>
</main>

<footer>
  <p>数据更新于 <span id="updateDate"></span> · AI 工具持续收录中</p>
  <p><a href="mailto:submit@aiarms.com">📬 提交新工具</a> · 所有链接均跳转至各工具官网</p>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部">↑</button>

<div class="toast" id="toast"></div>

<script>

/* ===== Constants ===== */
const CATEGORIES = [...new Set(TOOLS.map(t=>t.category))];
const CAT_COLORS = {
  '对话大模型':'var(--cat-01)',
  '图像生成':'var(--cat-02)',
  '视频生成':'var(--cat-03)',
  '音频音乐':'var(--cat-04)',
  '编程开发':'var(--cat-05)',
  '搜索研究':'var(--cat-06)',
  '办公生产力':'var(--cat-07)',
  '智能体与工作流':'var(--cat-08)',
  '开源与模型平台':'var(--cat-09)',
};
const CAT_NUMBERS = Object.fromEntries(CATEGORIES.map((c,i)=>[c,String(i+1).padStart(2,'0')]));
const PRICE_FILTERS = ['全部','免费','免费增值','付费'];
const PRICE_CLASS = { '免费':'free','免费增值':'freemium','付费':'paid' };

/* ===== State ===== */
let activeCategory = null;
let activePrice = '全部';
let searchQuery = '';

/* ===== DOM Refs ===== */
const $stats = document.getElementById('headerStats');
const $search = document.getElementById('searchInput');
const $marquee = document.getElementById('marqueeTrack');
const $catTabs = document.getElementById('catTabs');
const $priceFilters = document.getElementById('priceFilters');
const $toolsContainer = document.getElementById('toolsContainer');
const $toolsEmpty = document.getElementById('toolsEmpty');
const $themeToggle = document.getElementById('themeToggle');
const $refreshBtn = document.getElementById('refreshBtn');
const $backToTop = document.getElementById('backToTop');
const $updateDate = document.getElementById('updateDate');
const $toast = document.getElementById('toast');

/* ===== Helpers ===== */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function getDomain(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }catch{ return url; }
}

function highlightText(text, query){
  if(!query) return text;
  const escaped = escapeRegExp(query.trim());
  if(!escaped) return text;
  const re = new RegExp(`(${escaped})`,'gi');
  return text.replace(re,'<mark>$1</mark>');
}

function filterTools(){
  const q = searchQuery.trim().toLowerCase();
  return TOOLS.filter(t=>{
    if(activePrice!=='全部' && t.pricing!==activePrice) return false;
    if(!q) return true;
    return t.name.toLowerCase().includes(q)
        || t.desc.toLowerCase().includes(q)
        || t.tags.some(tg=>tg.toLowerCase().includes(q));
  });
}

function getFaviconURL(url){
  return `https://www.google.com/s2/favicons?domain=${getDomain(url)}&sz=64`;
}

/* ===== Render ===== */
function renderStats(){
  const filtered = filterTools();
  const cats = new Set(filtered.map(t=>t.category));
  $stats.innerHTML = `
    已收录 <span class="stat-num">${filtered.length}</span> 款
    <span aria-hidden="true">·</span>
    <span class="stat-num">${cats.size}</span> 个分类
  `;
}

function renderMarquee(){
  const hotTools = TOOLS.filter(t=>t.hot);
  const items = hotTools.map(t=>`<span class="marquee-item">⚡ ${t.name}</span>`).join('');
  $marquee.innerHTML = items + items;
}

function renderCatTabs(){
  $catTabs.innerHTML = CATEGORIES.map(c=>{
    const isActive = activeCategory===c;
    const color = CAT_COLORS[c];
    const style = isActive ? `background:${color};color:#fff;border-color:${color}` : '';
    return `<button class="cat-tab${isActive?' active':''}" data-cat="${c}" style="${style}" role="tab" aria-selected="${isActive}">
      <span class="cat-dot" style="background:${color}" aria-hidden="true"></span>${c}
    </button>`;
  }).join('');
}

function renderPriceFilters(){
  $priceFilters.innerHTML = PRICE_FILTERS.map(p=>{
    const isActive = activePrice===p;
    return `<button class="price-btn${isActive?' active':''}" data-price="${p}" role="radio" aria-checked="${isActive}">${p}</button>`;
  }).join('');
}

function renderToolCards(){
  const filtered = filterTools();
  const q = searchQuery.trim();

  $toolsEmpty.remove();

  if(filtered.length===0){
    $toolsContainer.innerHTML = '';
    $toolsContainer.appendChild($toolsEmpty);
    $toolsEmpty.style.display = 'block';
  }else{
    const grouped = {};
    CATEGORIES.forEach(c=>{ grouped[c]=[]; });
    filtered.forEach(t=>{ if(grouped[t.category]) grouped[t.category].push(t); });

    let html = '';
    CATEGORIES.forEach(cat=>{
      const tools = grouped[cat];
      if(tools.length===0) return;
      const color = CAT_COLORS[cat];
      const num = CAT_NUMBERS[cat];
      html += `<section class="cat-section" id="cat-${cat.replace(/\s+/g,'')}" data-cat="${cat}">
        <div class="cat-section-header">
          <span class="cat-section-num">${num}</span>
          <h2 class="cat-section-title">${cat}</h2>
          <span class="cat-section-line" style="background:${color}" aria-hidden="true"></span>
        </div>
        <div class="tools-grid">`;
      tools.forEach((t,i)=>{
        const priceCls = PRICE_CLASS[t.pricing]||'';
        const hotBadge = t.hot ? '<span class="card-hot-badge">HOT</span>' : '';
        const hasHot = t.hot ? ' card-has-hot' : '';
        let tagsHtml = t.tags.map(tg=>`<span class="tag">${highlightText(tg,q)}</span>`).join('');
        let nameHtml = highlightText(t.name,q);
        let descHtml = highlightText(t.desc,q);
        html += `<a href="${t.url}" class="tool-card${hasHot}" target="_blank" rel="noopener" data-index="${i}" style="--card-color:${color}">
          <div class="card-top">
            <img src="${getFaviconURL(t.url)}" class="card-favicon" alt="" loading="lazy" onerror="this.style.display='none'">
            <span class="card-name">${nameHtml}</span>
            <div class="card-badges">
              ${hotBadge}
              <span class="price-badge ${priceCls}">${t.pricing}</span>
            </div>
          </div>
          <p class="card-desc">${descHtml}</p>
          <div class="card-tags">${tagsHtml}</div>
          <span class="card-arrow" aria-hidden="true">↗</span>
        </a>`;
      });
      html += `</div></section>`;
    });
    $toolsContainer.innerHTML = html;
  }

  renderStats();
}

function observeSections(){
  const sections = document.querySelectorAll('.cat-section');
  if(!sections.length) return;
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        const cards = entry.target.querySelectorAll('.tool-card');
        cards.forEach((card,i)=>{ card.style.animationDelay=`${(i%4)*0.06}s`; card.classList.add('fade-in'); });
        observer.unobserve(entry.target);
      }
    });
  },{ threshold:0.08 });
  sections.forEach(s=>observer.observe(s));
}

/* ===== Event Handlers ===== */
function handleSearchInput(){
  searchQuery = $search.value;
  activeCategory = null;
  renderAll();
}

function handleCatTabClick(cat){
  $search.value = '';
  searchQuery = '';
  activeCategory = cat;
  renderAll();
  setTimeout(()=>{
    const el = document.querySelector(`[data-cat="${CSS.escape(cat)}"].cat-section`);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  },100);
}

function handlePriceClick(price){
  activePrice = price;
  activeCategory = null;
  renderAll();
}

function scrollToTop(){
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ===== Render All ===== */
function renderAll(){
  renderCatTabs();
  renderPriceFilters();
  renderToolCards();
  setTimeout(observeSections,100);
}

/* ===== Init ===== */
function init(){
  $updateDate.textContent = new Date().toLocaleDateString('zh-CN',{ year:'numeric', month:'long', day:'numeric' });
  renderMarquee();
  renderAll();

  /* Theme */
  const savedTheme = localStorage.getItem('theme')||'light';
  if(savedTheme==='dark') document.documentElement.setAttribute('data-theme','dark');
  updateThemeIcon();
  $themeToggle.addEventListener('click',()=>{
    const current = document.documentElement.getAttribute('data-theme');
    if(current==='dark'){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme','light');
    }else{
      document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('theme','dark');
    }
    updateThemeIcon();
  });

  function updateThemeIcon(){
    const icon = $themeToggle.querySelector('.theme-icon');
    const isDark = document.documentElement.getAttribute('data-theme')==='dark';
    icon.textContent = isDark?'☀️':'🌙';
    $themeToggle.setAttribute('aria-label',isDark?'切换浅色模式':'切换深色模式');
  }

  /* Search */
  $search.addEventListener('input',handleSearchInput);
  $search.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){ $search.value='';searchQuery='';renderAll();$search.blur(); }
  });

  /* Category tabs */
  $catTabs.addEventListener('click',(e)=>{
    const tab = e.target.closest('.cat-tab');
    if(!tab) return;
    handleCatTabClick(tab.dataset.cat);
  });

  /* Price filters */
  $priceFilters.addEventListener('click',(e)=>{
    const btn = e.target.closest('.price-btn');
    if(!btn) return;
    handlePriceClick(btn.dataset.price);
  });

  /* Back to top */
  $backToTop.addEventListener('click',scrollToTop);
  let scrollTicking = false;
  window.addEventListener('scroll',()=>{
    if(scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(()=>{
      $backToTop.classList.toggle('visible',window.scrollY>500);
      scrollTicking = false;
    });
  },{passive:true});

  /* Keyboard shortcuts */
  document.addEventListener('keydown',(e)=>{
    const tag = document.activeElement?.tagName;
    const isInput = tag==='INPUT'||tag==='TEXTAREA'||document.activeElement?.isContentEditable;
    if(e.key==='/' && !isInput){
      e.preventDefault();
      $search.focus();
    }
    if((e.metaKey||e.ctrlKey) && e.key==='k' && !isInput){
      e.preventDefault();
      $search.focus();
    }
  });

  /* Refresh */
  let toastTimer;
  function showToast(msg){
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.classList.add('show');
    toastTimer = setTimeout(()=>$toast.classList.remove('show'),1800);
  }
  $refreshBtn.addEventListener('click',()=>{
    const icon = $refreshBtn.querySelector('.refresh-icon');
    icon.classList.add('spinning');
    $search.value = ''; searchQuery = '';
    activeCategory = null; activePrice = '全部';
    $updateDate.textContent = new Date().toLocaleDateString('zh-CN',{ year:'numeric', month:'long', day:'numeric' });
    renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
    showToast('已刷新 · 共收录 '+TOOLS.length+' 款工具');
    icon.addEventListener('animationend',()=>icon.classList.remove('spinning'),{once:true});
  });

  /* Click on logo to reset */
  document.querySelector('.logo').addEventListener('click',(e)=>{
    e.preventDefault();
    $search.value='';
    searchQuery='';
    activeCategory=null;
    activePrice='全部';
    renderAll();
    $search.focus();
  });
  document.querySelector('.logo').style.cursor='pointer';
}

init();
</script>
</body>
</html>
